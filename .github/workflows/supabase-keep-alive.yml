name: Supabase Keep Alive

on:
  schedule:
    # Run every day at 00:00 UTC to keep the database active
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping-db:
    runs-on: ubuntu-latest
    environment: CRPA
    steps:
      - name: Ping Supabase Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL || secrets.SUPABASE_DB_URL }}
        run: |
          # Clean up any trailing/leading whitespaces, newlines, or carriage returns
          DATABASE_URL=$(echo "$DATABASE_URL" | tr -d '\r\n' | xargs)
          
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: DATABASE_URL is not set."
            exit 1
          fi
          # Execute an upsert query to update a record, keeping the database active
          psql "$DATABASE_URL" -c "
            DROP TABLE IF EXISTS public.keep_alive;
            CREATE TABLE public.keep_alive (
              id INT PRIMARY KEY,
              last_ping TEXT
            );
            INSERT INTO public.keep_alive (id, last_ping)
            VALUES (1, to_char(timezone('Asia/Kolkata', now()), 'YYYY-MM-DD HH12:MI:SS AM') || ' IST')
            ON CONFLICT (id) DO UPDATE SET last_ping = EXCLUDED.last_ping;
          "
